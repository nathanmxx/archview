<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArchView - Editor</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="stylesheet" href="/css/editor.css">

  <!-- O importmap deixa a gente escrever import ... from "three" no codigo,
       mas carregando o arquivo da pasta do projeto. Sem CDN: funciona
       mesmo se a internet da escola cair no dia da feira. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="editor">

    <!-- Faixa 1: o projeto -->
    <header class="barra-topo">
      <button class="botao-icone" id="btn-voltar" title="Voltar para meus projetos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>

      <input class="nome-projeto" id="nome-projeto" type="text" maxlength="60">
      <span class="estado-salvo" id="estado-salvo">Salvo</span>

      <span class="espaco"></span>

      <button class="botao-icone" id="btn-desfazer" title="Desfazer (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 3L3 13"/>
        </svg>
      </button>

      <button class="botao-icone" id="btn-refazer" title="Refazer (Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3L21 13"/>
        </svg>
      </button>

      <button class="botao-icone" id="btn-enquadrar" title="Enquadrar tudo na tela">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/>
        </svg>
      </button>

      <div class="divisoria"></div>

      <button class="botao-icone" id="btn-png" title="Baixar a planta como imagem PNG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="8.5" cy="9.5" r="1.5"/>
          <path d="M21 16l-5-5-6.5 6.5L7 15l-4 4"/>
        </svg>
      </button>

      <button class="botao-icone" id="btn-baixar" title="Baixar o projeto como arquivo (backup)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>
        </svg>
      </button>

      <button class="botao-icone" id="btn-abrir" title="Abrir um projeto de arquivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17V5M7 9l5-5 5 5M4 20h16"/>
        </svg>
      </button>

      <input type="file" id="entrada-arquivo" accept="application/json,.json" hidden>

      <div class="grupo-botoes">
        <button id="btn-2d" class="ativo">Planta 2D</button>
        <button id="btn-3d">Ver em 3D</button>
      </div>

      <button id="btn-passeio" class="botao-destaque oculto">Entrar e andar</button>
    </header>

    <!-- Faixa 2: ferramentas e os controles da ferramenta ativa -->
    <div class="barra-ferramentas">
      <div class="ferramentas" id="lista-ferramentas"></div>
      <div class="contexto" id="contexto-ferramenta"></div>
      <span class="espaco"></span>
      <span class="dica-ferramenta" id="dica-ferramenta"></span>
    </div>

    <!-- Faixa 3: o desenho, com os paineis flutuando por cima -->
    <div class="palco" id="palco">
      <canvas id="tela2d"></canvas>
      <div id="palco3d" class="oculto"></div>

      <aside class="painel-flutuante painel-moveis oculto" id="painel-moveis">
        <div class="titulo-flutuante">Moveis</div>
        <div class="grade-moveis" id="grade-moveis"></div>
      </aside>

      <aside class="painel-flutuante painel-propriedades oculto" id="painel-propriedades">
        <div class="titulo-flutuante" id="titulo-propriedades">Propriedades</div>
        <div id="propriedades"></div>
      </aside>

      <div class="dica-passeio oculto" id="dica-passeio">
        <b>W A S D</b> para andar &nbsp;·&nbsp; mouse para olhar
        &nbsp;·&nbsp; <b>Shift</b> corre &nbsp;·&nbsp; <b>Esc</b> sai
      </div>

      <div class="aviso-flutuante" id="aviso-flutuante"></div>
    </div>

    <!-- Faixa 4: status -->
    <footer class="barra-status">
      <span>Cursor: <span class="valor" id="status-cursor">0,00 ; 0,00 m</span></span>

      <span class="check-inline">
        <label for="sel-snap">Encaixe:</label>
        <select id="sel-snap">
          <option value="0">Livre</option>
          <option value="0.1">10 cm</option>
          <option value="0.25" selected>25 cm</option>
          <option value="0.5">50 cm</option>
          <option value="1">1 m</option>
        </select>
      </span>

      <span class="check-inline">
        <input type="checkbox" id="chk-grade" checked>
        <label for="chk-grade">Grade</label>
      </span>

      <span class="check-inline">
        <input type="checkbox" id="chk-cotas" checked>
        <label for="chk-cotas">Medidas</label>
      </span>

      <span class="espaco"></span>
      <span id="status-resumo"></span>
      <span>Zoom: <span class="valor" id="status-zoom">60</span> px/m</span>
    </footer>

  </div>

  <script type="module" src="/js/editor.js"></script>
</body>
</html>
